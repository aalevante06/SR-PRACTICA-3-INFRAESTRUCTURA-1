# FortiGate-2174 — Extracto relevante de la Práctica #3 / Infraestructura #1
# Archivo de documentación. No sustituye el backup completo.
# Solo conserva los bloques directamente relacionados con esta práctica.

config system interface
    edit "port1"
        set ip 21.74.3.2 255.255.255.252
        set allowaccess ping
        set alias "WAN-ISP"
        set role wan
    next
    edit "port3"
        set ip 192.168.79.99 255.255.255.0
        set allowaccess ping https http
    next
    edit "VLAN10-USERS"
        set ip 10.21.74.1 255.255.255.128
        set allowaccess ping
        set role lan
        set interface "port2"
        set vlanid 10
    next
    edit "VLAN20-USERS"
        set ip 10.21.74.129 255.255.255.128
        set allowaccess ping
        set role lan
        set interface "port2"
        set vlanid 20
    next
    edit "VLAN30-DMZ"
        set ip 10.21.75.1 255.255.255.240
        set allowaccess ping
        set role dmz
        set interface "port2"
        set vlanid 30
    next
end

config system dns
    set primary 192.168.42.1
end

config system dhcp server
    edit 2
        set default-gateway 10.21.74.1
        set netmask 255.255.255.128
        set interface "VLAN10-USERS"
        config ip-range
            edit 1
                set start-ip 10.21.74.10
                set end-ip 10.21.74.100
            next
        end
        set dns-server1 8.8.8.8
        set dns-server2 1.1.1.1
    next
    edit 3
        set dns-service default
        set default-gateway 10.21.74.129
        set netmask 255.255.255.128
        set interface "VLAN20-USERS"
        config ip-range
            edit 1
                set start-ip 10.21.74.140
                set end-ip 10.21.74.230
            next
        end
    next
end

config firewall address
    edit "VLAN10-USERS address"
        set type interface-subnet
        set subnet 10.21.74.1 255.255.255.128
        set interface "VLAN10-USERS"
    next
    edit "VLAN20-USERS address"
        set type interface-subnet
        set subnet 10.21.74.129 255.255.255.128
        set interface "VLAN20-USERS"
    next
    edit "VLAN30-DMZ address"
        set type interface-subnet
        set subnet 10.21.75.1 255.255.255.240
        set interface "VLAN30-DMZ"
    next
    edit "WEB-CAJA"
        set associated-interface "VLAN30-DMZ"
        set subnet 10.21.75.2 255.255.255.255
    next
    edit "WEB-INVENTARIO"
        set associated-interface "VLAN30-DMZ"
        set subnet 10.21.75.3 255.255.255.255
    next
    edit "DB-SERVER"
        set associated-interface "VLAN30-DMZ"
        set subnet 10.21.75.4 255.255.255.255
    next
    edit "GOOGLE-DNS"
        set associated-interface "port1"
        set subnet 8.8.8.8 255.255.255.255
    next
    edit "CLOUDFLARE-DNS"
        set associated-interface "port1"
        set subnet 1.1.1.1 255.255.255.255
    next
    edit "UBUNTU-ARCHIVE-IP"
        set associated-interface "port1"
        set subnet 185.125.190.82 255.255.255.255
    next
    edit "UBUNTU-SECURITY-IP"
        set associated-interface "port1"
        set subnet 91.189.91.83 255.255.255.255
    next
end

config firewall addrgrp
    edit "DMZ-SERVERS"
        set member "DB-SERVER" "WEB-CAJA" "WEB-INVENTARIO"
    next
    edit "UBUNTU-UPDATE-ENDPOINTS"
        set member "UBUNTU-ARCHIVE-IP" "UBUNTU-SECURITY-IP"
    next
    edit "DNS-SERVERS"
        set member "CLOUDFLARE-DNS" "GOOGLE-DNS"
    next
end

config webfilter urlfilter
    edit 1
        config entries
            edit 1
                set url "10.21.75.3"
                set action block
            next
        end
    next
end

config webfilter profile
    edit "BLOCK-INVENTARIO-VLAN10"
        config web
            set urlfilter-table 1
        end
    next
end

config router static
    edit 1
        set gateway 21.74.3.1
        set device "port1"
    next
end

config firewall policy
    edit 6
        set name "BLOCK-VLAN10-SSH-DMZ"
        set srcintf "VLAN10-USERS"
        set dstintf "VLAN30-DMZ"
        set srcaddr "VLAN10-USERS address"
        set dstaddr "DMZ-SERVERS"
        set schedule "always"
        set service "SSH"
        set logtraffic all
    next
    edit 7
        set name "VLAN20-DMZ"
        set srcintf "VLAN20-USERS"
        set dstintf "VLAN30-DMZ"
        set action accept
        set srcaddr "VLAN20-USERS address"
        set dstaddr "DMZ-SERVERS"
        set schedule "always"
        set service "SSH"
        set logtraffic all
    next
    edit 8
        set name "VLAN10-BLOCK-INVENTARIO"
        set srcintf "VLAN10-USERS"
        set dstintf "VLAN30-DMZ"
        set action accept
        set srcaddr "VLAN10-USERS address"
        set dstaddr "WEB-INVENTARIO"
        set schedule "always"
        set service "HTTP"
        set utm-status enable
        set ssl-ssh-profile "certificate-inspection"
        set webfilter-profile "BLOCK-INVENTARIO-VLAN10"
        set logtraffic all
    next
    edit 9
        set name "BLOCK-DMZ-TO-VLAN10"
        set srcintf "VLAN30-DMZ"
        set dstintf "VLAN10-USERS"
        set srcaddr "VLAN30-DMZ address"
        set dstaddr "VLAN10-USERS address"
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next
    edit 10
        set name "BLOCK-DMZ-TO-VLAN20"
        set srcintf "VLAN30-DMZ"
        set dstintf "VLAN20-USERS"
        set srcaddr "VLAN30-DMZ address"
        set dstaddr "VLAN20-USERS address"
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next
    edit 11
        set name "DMZ-DNS"
        set srcintf "VLAN30-DMZ"
        set dstintf "port1"
        set action accept
        set srcaddr "VLAN30-DMZ address"
        set dstaddr "DNS-SERVERS"
        set schedule "always"
        set service "DNS"
        set logtraffic all
        set nat enable
    next
    edit 12
        set name "DMZ-UBUNTU-UPDATES"
        set srcintf "VLAN30-DMZ"
        set dstintf "port1"
        set action accept
        set srcaddr "VLAN30-DMZ address"
        set dstaddr "UBUNTU-UPDATE-ENDPOINTS"
        set schedule "always"
        set service "HTTP" "HTTPS"
        set logtraffic all
        set nat enable
    next
    edit 13
        set name "BLOCK-DMZ-INTERNET"
        set srcintf "VLAN30-DMZ"
        set dstintf "port1"
        set srcaddr "VLAN30-DMZ address"
        set dstaddr "all"
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next
end
